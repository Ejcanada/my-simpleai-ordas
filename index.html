<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Heritage Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
    <header>
        <div class="header-content">
            <h1>Explore World Landmarks</h1>
            <p>Activities, attractions, and heritage sites globally</p>
        </div>
    </header>
    
    <main>
        <!-- SEARCH -->
        <section class="search">
            <input type="text" id="searchInput" placeholder="Where to? Search for a landmark, region, or country...">
            <button onclick="searchLandmarks()">Search</button>
            <button class="secondary" onclick="loadLandmarks()">Show All</button>
        </section>
 
        <section>
            <h2>Browse landmarks by category</h2>
            <div id="landmarkList" class="landmark-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading landmarks...</p>
                </div>
            </div>
        </section>
    </main>
 
    <!-- CUSTOM ALERT / MODAL -->
    <div id="landmarkModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>
 
    <footer>
        <p>World Heritage Directory &copy; 2026</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
